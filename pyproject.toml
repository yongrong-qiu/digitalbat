[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalbat"
version = "0.1.0"
description = "A hippocampal digital Twin of CA1/CA3 activity in freely flying bats"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Everything imported at module level by the `digitalbat` package.
# Install PyTorch first if you need a specific CUDA build (see README).
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm",
    "h5py",
    "numba",
    "transformers",
]

[project.optional-dependencies]
# Extra imports needed by notebooks/figures.ipynb (and the Twin's Optuna search).
figures = [
    "optuna>=4.0",
    # cebra itself is installed separately with --no-deps (see README): on Windows it
    # declares numpy<2, which would downgrade NumPy. These are its other dependencies.
    "literate-dataclasses",
    "requests",
    "POT",
    "statsmodels",
    "joblib",
    "jupyterlab",
    "ipykernel",
]
# digitalbat.utility.interpreter
interpret = ["shap"]
# notebooks/latent_motifs.ipynb (motif_helpers.py)
motifs = ["dynamax", "jax"]
# Imports used only by the exploratory notebooks (see README, "Other notebooks").
notebooks = [
    "plotly",
    "umap-learn",
    "ipympl",
    "ripser",
    "persim",
    "rastermap",
    "diptest",
]
all = ["digitalbat[figures,interpret,motifs,notebooks]"]

[tool.setuptools.packages.find]
include = ["digitalbat*"]
